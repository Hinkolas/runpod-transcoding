# yaml-language-server: $schema=https://raw.githubusercontent.com/Hinkolas/skali/main/schemas/skali.schema.json

name: transcoding-demo
description: Video transcoding demo UI that drives the RunPod transcoding worker over HTTP transport

# Video records live in Postgres, source videos and HLS output in the bucket, so
# any replica can serve the browser and the worker's source/output requests.
applications:
  web:
    build:
      context: .

    environment:
      RUNPOD_API_KEY: '${RUNPOD_API_KEY}'
      RUNPOD_ENDPOINT_ID: '${RUNPOD_ENDPOINT_ID}'
      APP_ID: '${APP_ID:-demo-ui}'
      # Where the worker reaches this app. Empty falls back to ORIGIN; set it to
      # a tunnel URL locally, since RunPod can't reach *.localhost.
      PUBLIC_BASE_URL: '${PUBLIC_BASE_URL:-}'
      # adapter-node otherwise derives the URL from the plain-HTTP hop behind the edge.
      ORIGIN: 'https://${APP_DOMAIN}'

      DATABASE_URL: '{{databases.data.url}}'
      S3_ENDPOINT: '{{buckets.media.endpoint}}'
      S3_BUCKET: '{{buckets.media.name}}'
      S3_REGION: '{{buckets.media.region}}'
      S3_ACCESS_KEY: '{{buckets.media.access_key}}'
      S3_SECRET_KEY: '{{buckets.media.secret_key}}'

    ports:
      http:
        port: 3000

    routes:
      public:
        domain: '${APP_DOMAIN}'
        port: http

    health:
      readiness:
        http:
          port: http
          path: /health/ready
      liveness:
        http:
          port: http
          path: /healthz

    # Uploads stream into the bucket; only single HLS segments are buffered.
    resources:
      requests:
        cpu: 0.1
        memory: 192MB
      limits:
        cpu: 1
        memory: 768MB

    deployment:
      releaseCommand:
        command: [node, scripts/migrate.js]
        timeout: 2m

    commands:
      migrate: [node, scripts/migrate.js]

    # Pinned so a tunnel (cloudflared tunnel --url http://localhost:5173) can
    # expose the dev server to RunPod as PUBLIC_BASE_URL.
    dev:
      command: [bun, run, dev, --, --port, '${PORT}', --host]
      ports:
        http: 5173

databases:
  data:
    engine: postgres
    version: 18
    storage:
      size: 1GB

buckets:
  media:
    visibility: private
    quotas:
      storage: 20GB
